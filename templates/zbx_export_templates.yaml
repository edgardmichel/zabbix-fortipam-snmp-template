        - uuid: c9aebb739a484d1db529391ce7d578e4
          name: 'FortiPAM: License discovery'
          type: DEPENDENT
          key: fortipam.license.discovery
          filter:
            conditions:
              - macro: '{#LICNAME}'
                value: '{$FORTIPAM.LICENSE.MATCHES}'
          item_prototypes:
            - uuid: 47390529afc04077b225cbf6e6bd1e6e
              name: 'FortiPAM: License {#LICNAME}: Expiry'
              type: DEPENDENT
              key: 'fortipam.license.expiry[{#SNMPINDEX}]'
              units: unixtime
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.12356.101.4.6.3.1.2.1.2.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (value === '' || value === 'n/a') {
                          throw 'License expiry unavailable';
                      }
                      
                      var m = value.match(
                          /^\w{3}\s+(\w{3})\s+(\d{1,2})\s+(\d{2}):(\d{2}):(\d{2})\s+(\d{4})$/
                      );
                      
                      if (!m) {
                          throw 'Unexpected Fortinet date: ' + value;
                      }
                      
                      var months = {
                          Jan: 0,
                          Feb: 1,
                          Mar: 2,
                          Apr: 3,
                          May: 4,
                          Jun: 5,
                          Jul: 6,
                          Aug: 7,
                          Sep: 8,
                          Oct: 9,
                          Nov: 10,
                          Dec: 11
                      };
                      
                      return Math.floor(Date.UTC(
                          parseInt(m[6], 10),
                          months[m[1]],
                          parseInt(m[2], 10),
                          parseInt(m[3], 10),
                          parseInt(m[4], 10),
                          parseInt(m[5], 10)
                      ) / 1000);
              master_item:
                key: fortipam.license.walk
              trigger_prototypes:
                - uuid: bf15885751654c4c80b7fece6011e564
                  expression: |
                    last(/Fortinet FortiPAM by SNMP/fortipam.license.expiry[{#SNMPINDEX}])>now()
                    and
                    last(/Fortinet FortiPAM by SNMP/fortipam.license.expiry[{#SNMPINDEX}])<=now()+{$FORTIPAM.LICENSE.CRIT}
                  name: 'FortiPAM: License {#LICNAME} expires in less than 7 days'
                  priority: DISASTER
                - uuid: 137aa17e5ff9402a8d1e9862371e748e
                  expression: |
                    last(/Fortinet FortiPAM by SNMP/fortipam.license.expiry[{#SNMPINDEX}])>now()+{$FORTIPAM.LICENSE.CRIT}
                    and
                    last(/Fortinet FortiPAM by SNMP/fortipam.license.expiry[{#SNMPINDEX}])<=now()+{$FORTIPAM.LICENSE.HIGH}
                  name: 'FortiPAM: License {#LICNAME} expires in less than 30 days'
                  priority: HIGH
                - uuid: 338ef9f0d75f4fe891d07a789aaaa5e7
                  expression: |
                    last(/Fortinet FortiPAM by SNMP/fortipam.license.expiry[{#SNMPINDEX}])>now()+{$FORTIPAM.LICENSE.HIGH}
                    and
                    last(/Fortinet FortiPAM by SNMP/fortipam.license.expiry[{#SNMPINDEX}])<=now()+{$FORTIPAM.LICENSE.WARN}
                  name: 'FortiPAM: License {#LICNAME} expires in less than 60 days'
                  priority: WARNING
                - uuid: c6ed347f696e40a38c0a1a386b0ced2a
                  expression: 'last(/Fortinet FortiPAM by SNMP/fortipam.license.expiry[{#SNMPINDEX}])<=now()'
                  name: 'FortiPAM: License {#LICNAME} has expired'
                  priority: DISASTER
          master_item:
            key: fortipam.license.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#LICNAME}'
                - 1.3.6.1.4.1.12356.101.4.6.3.1.2.1.1
                - '0'
                - '{#LICEXPIRY}'
                - 1.3.6.1.4.1.12356.101.4.6.3.1.2.1.2
                - '0'
