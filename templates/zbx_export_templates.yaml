zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 37ef4abdf60343d7afd0fc434bbd46b1
      template: 'Fortinet FortiPAM by SNMP'
      name: 'Fortinet FortiPAM by SNMP'
      groups:
        - name: Templates
        - name: 'Templates/Network devices'
      items:
        - uuid: 7e1a72033cb543c4af537243505b9bee
          name: 'FortiPAM: Number of administrators'
          type: SNMP_AGENT
          snmp_oid: 'get[.1.3.6.1.4.1.12356.100.1.2.100.1.0]'
          key: fortipam.admin.count
          delay: 10m
          tags:
            - tag: class
              value: information
            - tag: component
              value: security
          triggers:
            - uuid: 4144bf589fd44c1aa2d40969148c23ff
              expression: 'change(/Fortinet FortiPAM by SNMP/fortipam.admin.count)<>0'
              name: 'FortiPAM: Administrator count changed'
              priority: WARNING
        - uuid: fcde56547c4242758c3144bcdbdf75bb
          name: 'FortiPAM: Authentication EAGAIN errors'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12356.101.10.116.1.2.0]'
          key: fortipam.auth.eagain.total
          tags:
            - tag: class
              value: information
            - tag: component
              value: authentication
          triggers:
            - uuid: 389a7614c40c4f878ef6a4c46aceee56
              expression: 'change(/Fortinet FortiPAM by SNMP/fortipam.auth.eagain.total)>0'
              name: 'FortiPAM: Auth EAGAIN Total'
              priority: WARNING
        - uuid: f06d40265bb641bba790d4c37afa4f85
          name: 'FortiPAM: LDAP connection failures'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12356.101.10.116.1.3.0]'
          key: fortipam.auth.ldap.failures.total
          tags:
            - tag: class
              value: information
            - tag: component
              value: authentication
          triggers:
            - uuid: 4c1e5dd9d77c4faa88bffc10a063afbb
              expression: 'change(/Fortinet FortiPAM by SNMP/fortipam.auth.ldap.failures.total)>0'
              name: 'FortiPAM: LDAP Failures detected'
              priority: AVERAGE
        - uuid: 4200fc42ac404849bb511293b496f3d7
          name: 'FortiPAM: Authentication requests rate'
          type: DEPENDENT
          key: fortipam.auth.requests.rate
          value_type: FLOAT
          units: req/s
          preprocessing:
            - type: CHANGE_PER_SECOND
          master_item:
            key: fortipam.auth.requests.total
          tags:
            - tag: component
              value: security
        - uuid: 6dc6dd354dd14fcc8bdd2349f405c825
