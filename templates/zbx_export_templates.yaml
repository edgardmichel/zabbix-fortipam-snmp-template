              expression: 'min(/Fortinet FortiPAM by SNMP/fortipam.cpu.util,5m)>{$FORTIPAM.CPU.HIGH}'
              name: 'High CPU'
              priority: HIGH
            - uuid: 7b84aeeb32174378866bd241615fd8fa
              expression: |
                min(/Fortinet FortiPAM by SNMP/fortipam.cpu.util,5m)>{$FORTIPAM.CPU.WARN}
                and
                min(/Fortinet FortiPAM by SNMP/fortipam.cpu.util,5m)<={$FORTIPAM.CPU.HIGH}
              name: 'Warning CPU'
              priority: WARNING
