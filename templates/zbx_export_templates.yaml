          name: 'FortiPAM: Disk utilization'
          type: CALCULATED
          key: fortipam.disk.util
          value_type: FLOAT
          units: '%'
          params: '100 * last(//fortipam.disk.used) / last(//fortipam.disk.total)'
          tags:
            - tag: class
              value: health
            - tag: component
              value: disk
          triggers:
