          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12356.101.22.1.3.0]'
          key: fortipam.config.lastchange
          delay: 5m
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: class
              value: security
            - tag: component
              value: configuration
        - uuid: e82eb486f88f4b5bbf89c55bfea24ea3
