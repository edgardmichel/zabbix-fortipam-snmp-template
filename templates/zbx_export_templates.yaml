              value: information
            - tag: component
              value: authentication
        - uuid: 4e90474bfffe4fd49fe76967383d38bf
          name: 'FortiPAM: Time since last configuration change'
          type: CALCULATED
          key: fortipam.config.change.age
          delay: 5m
          history: 90d
          units: uptime
          params: last(//fortipam.uptime)-last(//fortipam.config.lastchange)
          tags:
            - tag: class
              value: security
            - tag: component
              value: configuration
        - uuid: f032cfda49544ea29f02837045148766
          name: 'FortiPAM: Configuration checksum'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12356.101.22.1.2.0]'
          key: fortipam.config.checksum
