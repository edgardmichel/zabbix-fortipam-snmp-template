          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12356.101.4.1.3.0]'
          key: fortipam.cpu.util
          units: '%'
          tags:
            - tag: class
              value: health
            - tag: component
              value: cpu
          triggers:
