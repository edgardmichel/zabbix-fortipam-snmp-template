            - uuid: 1d1f16cdd66b4e88950796d468c7e649
              name: 'FortiPAM: HA member {#HASERIAL}: Sessions'
              type: DEPENDENT
              key: 'fortipam.ha.sessions[{#SNMPINDEX}]'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.12356.101.13.2.1.1.6.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fortipam.ha.walk
            - uuid: eee149f140ab47f1a8d042f371483517
              name: 'FortiPAM: HA member {#HASERIAL}: Last unsuccessful sync'
              type: DEPENDENT
              key: 'fortipam.ha.sync.lastfailure[{#SNMPINDEX}]'
              units: unixtime
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.12356.101.13.2.1.1.14.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var s = value.trim();
                      
                      var parts = s.split(/\s+/);
                      if (parts.length < 8) {
                          throw 'Invalid SNMP DateAndTime: ' + value;
                      }
                      
                      var b = [];
                      for (var i = 0; i < parts.length; i++) {
                          b.push(parseInt(parts[i], 16));
                      }
                      
                      var year = (b[0] << 8) + b[1];
                      
                      if (year === 0) {
                          return null;
                      }
                      
                      var month = b[2];
                      var day   = b[3];
                      var hour  = b[4];
                      var min   = b[5];
                      var sec   = b[6];
                      var deci  = b[7];
                      
                      var ts = Date.UTC(
                          year,
                          month - 1,
                          day,
                          hour,
                          min,
                          sec,
                          deci * 100
                      );
                      
                      if (b.length >= 11) {
                          var direction = String.fromCharCode(b[8]);
                          var offsetMinutes = (b[9] * 60) + b[10];
                      
                          if (direction === '+') {
                              ts -= offsetMinutes * 60000;
                          } else if (direction === '-') {
                              ts += offsetMinutes * 60000;
                          }
                      }
                      
                      return Math.floor(ts / 1000);
              master_item:
                key: fortipam.ha.walk
            - uuid: a0f9f1a0298e429cae4a712d67538813
              name: 'FortiPAM: HA member {#HASERIAL}: Last successful sync'
              type: DEPENDENT
              key: 'fortipam.ha.sync.lastsuccess[{#SNMPINDEX}]'
              units: unixtime
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.12356.101.13.2.1.1.13.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var s = value.trim();
                      
                      var parts = s.split(/\s+/);
                      if (parts.length < 8) {
                          throw 'Invalid SNMP DateAndTime: ' + value;
                      }
                      
                      var b = [];
                      for (var i = 0; i < parts.length; i++) {
                          b.push(parseInt(parts[i], 16));
                      }
                      
                      var year = (b[0] << 8) + b[1];
                      
                      if (year === 0) {
                          return null;
                      }
                      
                      var month = b[2];
                      var day   = b[3];
                      var hour  = b[4];
                      var min   = b[5];
                      var sec   = b[6];
                      var deci  = b[7];
                      
                      var ts = Date.UTC(
                          year,
                          month - 1,
                          day,
                          hour,
                          min,
                          sec,
                          deci * 100
                      );
                      
                      if (b.length >= 11) {
                          var direction = String.fromCharCode(b[8]);
                          var offsetMinutes = (b[9] * 60) + b[10];
                      
                          if (direction === '+') {
                              ts -= offsetMinutes * 60000;
                          } else if (direction === '-') {
                              ts += offsetMinutes * 60000;
                          }
                      }
                      
                      return Math.floor(ts / 1000);
              master_item:
                key: fortipam.ha.walk
            - uuid: acae2eeb751649289585d965d72c41bc
              name: 'FortiPAM: HA member {#HASERIAL}: Synchronization status'
              type: DEPENDENT
              key: 'fortipam.ha.sync[{#SNMPINDEX}]'
              valuemap:
                name: 'Fortinet HA Sync'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.12356.101.13.2.1.1.12.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fortipam.ha.walk
          trigger_prototypes:
