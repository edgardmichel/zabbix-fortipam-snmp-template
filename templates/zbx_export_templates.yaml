          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12356.101.4.1.7.0]'
          key: fortipam.disk.total
          delay: 1h
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1048576'
          tags:
            - tag: class
              value: health
            - tag: component
              value: disk
        - uuid: 9424721736f54fb6a14979fb8f3a74b4
          name: 'FortiPAM: Disk used'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12356.101.4.1.6.0]'
          key: fortipam.disk.used
